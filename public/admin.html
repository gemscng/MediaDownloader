<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f0f0f;color:#fff;padding:40px;max-width:500px;margin:0 auto}
h1{color:#ff4444;margin-bottom:20px}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin:12px 0}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222}
.stat:last-child{border:none}
.green{color:#4CAF50}.orange{color:#ff9800}
.btn{background:#ff4444;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;cursor:pointer;font-size:14px;font-weight:600;margin-top:8px}
.btn:hover{background:#ff6666}
label.upload{display:inline-block;padding:10px 20px;background:#333;border-radius:8px;cursor:pointer;margin-top:8px}
label.upload:hover{background:#444}
input[type=file]{display:none}
</style>
</head>
<body>
<h1>🔧 Admin Panel</h1>
<div class="card" id="statusCard">
  <h3 style="margin-bottom:12px">Server Status</h3>
  <div class="stat"><span>🍪 Cookies</span><span id="cookieStatus">Loading...</span></div>
  <div class="stat"><span>📦 Downloads</span><span id="dlCount">-</span></div>
  <div class="stat"><span>⏱️ Uptime</span><span id="uptime">-</span></div>
  <div class="stat"><span>💾 Memory</span><span id="memory">-</span></div>
</div>
<div class="card">
  <h3 style="margin-bottom:12px">🍪 Cookie Management</h3>
  <p style="font-size:13px;color:#888;margin-bottom:12px">Upload browser cookies for YouTube/Facebook/Instagram authentication.</p>
  <label class="upload">📁 Upload cookies.txt<input type="file" accept=".txt" onchange="uc(this)"></label>
  <button class="btn" style="background:#333;margin-top:8px" onclick="fetch('/cookies',{method:'DELETE'}).then(()=>location.reload())">🗑 Delete Cookies</button>
</div>
<div class="card">
  <h3 style="margin-bottom:12px">🧹 Cleanup</h3>
  <button class="btn" onclick="fetch('/files/clear',{method:'POST'}).then(()=>alert('Cleared!')).then(()=>location.reload())">🗑 Clear All Downloads</button>
</div>
<a href="/" style="display:block;text-align:center;color:#ff4444;margin-top:20px">← Back to Downloader</a>
<script>
async function uc(i){var f=new FormData();f.append("cookies",i.files[0]);var r=await fetch("/cookies",{method:"POST",body:f});var d=await r.json();alert(d.message);location.reload()}
fetch('/health').then(r=>r.json()).then(d=>{
  document.getElementById('dlCount').textContent=d.downloads+' files';
}).catch(()=>{});
</script>
</body>
</html>
